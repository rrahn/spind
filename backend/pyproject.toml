[project]
name = "locker-tools"
version = "0.1.0"
description = "Locker assignment tooling for the spind backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "networkx>=2.7",
    "click>=8.1",
    "rich>=13.0",
    "rich-click>=1.7",
    "pydantic>=2",
]

[project.scripts]
locker-tools = "locker_tools.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["locker_tools*"]

[dependency-groups]
dev = [
    "pytest>=8",
]
