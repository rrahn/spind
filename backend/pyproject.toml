[project]
name = "locker-tools"
version = "0.1.0"
description = "Locker assignment tooling for the spind backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "networkx>=2.7",
    "click>=8.1",
    "rich>=13.0",
    "rich-click>=1.7",
    "pydantic>=2",
    "openpyxl>=3.1.5",
    "jinja2>=3",
    "django>=5.2,<5.3",
    "django-ninja>=1.4,<2",
    "django-allauth[headless]>=65,<66",
    "psycopg[binary]>=3.2,<4",
    "cryptography>=46,<47",
]

[project.scripts]
locker-tools = "locker_tools.main:cli"
locker-web = "locker_tools.web.manage:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["locker_tools*"]

[tool.setuptools.package-data]
locker_tools = ["templates/*.j2"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.11,<5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "locker_tools.web.settings_test"
testpaths = ["tests"]
